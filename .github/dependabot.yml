# Keeps the NuGet packages and the pinned GitHub Actions current. Each update arrives as a pull
# request that CI builds and tests like any other.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
