name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore WinGuard.sln

      # The command exits 0 whatever it finds, so the findings have to be read from its report.
      - name: Check dependencies for known vulnerabilities
        shell: pwsh
        run: |
          $report = dotnet list WinGuard.sln package --vulnerable --include-transitive --format json
          if ($LASTEXITCODE -ne 0) { $report; exit $LASTEXITCODE }
          $packages = ($report | Out-String | ConvertFrom-Json).projects |
            ForEach-Object { $_.frameworks } |
            ForEach-Object { @($_.topLevelPackages) + @($_.transitivePackages) } |
            Where-Object { $_ }
          if ($packages) {
            $report
            Write-Error "$(@($packages).Count) vulnerable package reference(s) found."
            exit 1
          }

      - run: dotnet build WinGuard.sln -c Release --no-restore
      - run: dotnet test tests/WinGuard.Core.Tests -c Release --no-build --filter "Category!=Integration"

  # Builds the real installer and runs it on the runner, which is an elevated administrator: the
  # paths the unit tests cannot reach. Setup into a folder outside Program Files, the service
  # starting as LocalSystem, the command line talking to it through the pipe, and --install
  # refusing a folder that users can write to.
  installer-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        shell: pwsh
        run: |
          foreach ($project in 'Service', 'Gui') {
            dotnet publish "src/WinGuard.$project/WinGuard.$project.csproj" -c Release -r win-x64 `
              -p:PublishSingleFile=true -p:SelfContained=true `
              -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false `
              -p:Version=0.0.1 -o "publish/$($project.ToLower())"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          New-Item -Type Directory dist -Force | Out-Null
          Copy-Item publish/service/winguard-svc.exe dist/
          Copy-Item publish/gui/winguard-gui.exe dist/
          Copy-Item src/WinGuard.Service/appsettings.json dist/
          Copy-Item installer/assets/* dist/ -Recurse
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=0.0.1 installer/winguard.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: --install refuses a folder that users can write to
        shell: pwsh
        run: |
          New-Item -Type Directory C:\WinGuardOpen | Out-Null
          icacls C:\WinGuardOpen /grant '*S-1-5-32-545:(OI)(CI)M' | Out-Null
          Copy-Item publish/service/winguard-svc.exe C:\WinGuardOpen\
          & C:\WinGuardOpen\winguard-svc.exe --install
          $code = $LASTEXITCODE
          sc.exe query WinGuardService | Out-Null
          if ($code -eq 0 -or $LASTEXITCODE -eq 0) { throw "--install registered a service from a user-writable folder (exit $code)." }
          exit 0

      - name: Setup installs outside Program Files and locks the folder
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer/Output/WinGuard-Setup-0.0.1.exe).FullName
          $process = Start-Process $setup -Wait -PassThru -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/DIR=C:\WinGuardSmoke', "/LOG=$PWD\setup.log"
          if ($process.ExitCode -ne 0) { Get-Content setup.log -Tail 60; throw "Setup exited with $($process.ExitCode)." }

          if ((Get-Service WinGuardService).Status -ne 'Running') { throw 'The service is not running after Setup.' }

          $trusted = 'S-1-5-18', 'S-1-5-32-544', 'S-1-5-80-956008885-3418522649-1831038044-1853292631-2271478464'
          $write = [Security.AccessControl.FileSystemRights]'WriteData, AppendData, Delete, DeleteSubdirectoriesAndFiles, ChangePermissions, TakeOwnership'
          foreach ($item in @(Get-Item C:\WinGuardSmoke) + @(Get-ChildItem C:\WinGuardSmoke)) {
            $acl = Get-Acl $item.FullName
            $owner = $acl.GetOwner([Security.Principal.SecurityIdentifier]).Value
            if ($owner -notin $trusted) { throw "$($item.FullName) is owned by $owner." }
            foreach ($rule in $acl.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier])) {
              if ($rule.AccessControlType -eq 'Allow' -and ($rule.FileSystemRights -band $write) -and $rule.IdentityReference.Value -notin $trusted) {
                throw "$($item.FullName) can be changed by $($rule.IdentityReference.Value)."
              }
            }
          }

      - name: The command line reaches the service through the pipe
        shell: pwsh
        run: |
          # The pipe opens a moment after the service reports running.
          foreach ($attempt in 1..20) {
            & C:\WinGuardSmoke\winguard-svc.exe --status
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 3
          }
          Get-ChildItem C:\ProgramData\WinGuard\Logs | ForEach-Object { Get-Content $_.FullName -Tail 40 }
          throw '--status never reached the service.'

      - name: Setup upgrades in place
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer/Output/WinGuard-Setup-0.0.1.exe).FullName
          $process = Start-Process $setup -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$PWD\upgrade.log"
          if ($process.ExitCode -ne 0) { Get-Content upgrade.log -Tail 60; throw "The upgrade exited with $($process.ExitCode)." }
          if ((Get-Service WinGuardService).Status -ne 'Running') { throw 'The service is not running after the upgrade.' }
          if (-not (Test-Path C:\WinGuardSmoke\winguard-svc.exe)) { throw 'The upgrade did not keep the install folder.' }

      - name: Uninstall
        shell: pwsh
        run: |
          $process = Start-Process C:\WinGuardSmoke\unins000.exe -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($process.ExitCode -ne 0) { throw "Uninstall exited with $($process.ExitCode)." }
          Start-Sleep -Seconds 5
          if (Get-Service WinGuardService -ErrorAction SilentlyContinue) { throw 'The service is still registered after uninstall.' }
