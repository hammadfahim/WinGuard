name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore WinGuard.sln

      # The command exits 0 whatever it finds, so the findings have to be read from its report.
      - name: Check dependencies for known vulnerabilities
        shell: pwsh
        run: |
          $report = dotnet list WinGuard.sln package --vulnerable --include-transitive --format json
          if ($LASTEXITCODE -ne 0) { $report; exit $LASTEXITCODE }
          $packages = ($report | Out-String | ConvertFrom-Json).projects |
            ForEach-Object { $_.frameworks } |
            ForEach-Object { @($_.topLevelPackages) + @($_.transitivePackages) } |
            Where-Object { $_ }
          if ($packages) {
            $report
            Write-Error "$(@($packages).Count) vulnerable package reference(s) found."
            exit 1
          }

      - run: dotnet build WinGuard.sln -c Release --no-restore
      - run: dotnet test tests/WinGuard.Core.Tests -c Release --no-build --filter "Category!=Integration"