name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write            # needed to create the release

jobs:
  release:
    runs-on: windows-latest
    env:
      # Code signing is optional: without these two secrets the signing steps are skipped and the
      # release is built unsigned, as before. WINGUARD_SIGNING_PFX_BASE64 is the PFX file in
      # base64, WINGUARD_SIGNING_PFX_PASSWORD its password. A step's "if" cannot read secrets, so
      # the job exposes only whether they are set.
      SIGNING_ENABLED: ${{ secrets.WINGUARD_SIGNING_PFX_BASE64 != '' && secrets.WINGUARD_SIGNING_PFX_PASSWORD != '' }}
      # The console's "Check for updates" trusts a release only through latest.json and its signature,
      # made with WINGUARD_UPDATE_SIGNING_KEY (an ECDSA P-256 private key, PKCS#8 PEM). Its public
      # half is compiled into the program (src/WinGuard.Core/Updates/UpdateSource.cs). Without the
      # secret the release is still built, but installed copies cannot update to it from the console.
      UPDATE_SIGNING_ENABLED: ${{ secrets.WINGUARD_UPDATE_SIGNING_KEY != '' }}
      TIMESTAMP_URL: http://timestamp.digicert.com
    steps:
      # Actions are pinned to commit SHAs (the comment names the tag each SHA was taken from).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      # Never publish a release from a commit whose tests fail.
      - name: Test
        run: dotnet test tests/WinGuard.Core.Tests -c Release --filter "Category!=Integration"

      # The version goes into command lines below, so it is only ever digits and dots. A tag must
      # also point at a commit that is on main: a tag pushed from any other branch builds nothing.
      - name: Compute version
        id: ver
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "Tag '$GITHUB_REF_NAME' does not point at a commit on main." >&2
            exit 1
          fi
          echo "v=$version" >> "$GITHUB_OUTPUT"

      - name: Publish service
        run: dotnet publish src/WinGuard.Service/WinGuard.Service.csproj -c Release -r win-x64
             -p:PublishSingleFile=true -p:SelfContained=true
             -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false
             -p:Version=${{ steps.ver.outputs.v }} -o publish/service

      - name: Publish GUI
        run: dotnet publish src/WinGuard.Gui/WinGuard.Gui.csproj -c Release -r win-x64
             -p:PublishSingleFile=true -p:SelfContained=true
             -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false
             -p:Version=${{ steps.ver.outputs.v }} -o publish/gui

      # The key goes into the runner's certificate store and is used by thumbprint from then on, so
      # neither the password nor a key file ever appears on a command line or stays on disk.
      - name: Prepare code signing
        id: signing
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINGUARD_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINGUARD_SIGNING_PFX_PASSWORD }}
        run: |
          $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]'UserKeySet,PersistKeySet'
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            [Convert]::FromBase64String($env:PFX_BASE64), $env:PFX_PASSWORD, $flags)
          $store = [Security.Cryptography.X509Certificates.X509Store]::new('My', 'CurrentUser')
          $store.Open('ReadWrite')
          $store.Add($certificate)
          $store.Close()

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw 'signtool.exe was not found on this runner.' }

          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          "signtool=$($signtool.FullName)" >> $env:GITHUB_OUTPUT

      - name: Sign the executables
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          SIGNTOOL: ${{ steps.signing.outputs.signtool }}
          THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
        run: |
          & $env:SIGNTOOL sign /sha1 $env:THUMBPRINT /fd SHA256 /tr $env:TIMESTAMP_URL /td SHA256 `
            publish/service/winguard-svc.exe publish/gui/winguard-gui.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage installer inputs
        shell: pwsh
        run: |
          New-Item -Type Directory dist -Force | Out-Null
          Copy-Item publish/service/winguard-svc.exe dist/
          Copy-Item publish/gui/winguard-gui.exe dist/
          Copy-Item src/WinGuard.Service/appsettings.json dist/
          Copy-Item installer/assets/* dist/ -Recurse

      - name: Build installer (Inno Setup)
        shell: pwsh
        env:
          SIGNTOOL: ${{ steps.signing.outputs.signtool }}
          THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
        run: |
          $arguments = @('/DMyAppVersion=${{ steps.ver.outputs.v }}')
          if ($env:SIGNING_ENABLED -eq 'true') {
            # Setup signs its embedded uninstaller and itself with this command; $f is the file.
            $arguments += '/DEnableSigning'
            $arguments += "/Swinguardsign=`$q$env:SIGNTOOL`$q sign /sha1 $env:THUMBPRINT /fd SHA256 /tr $env:TIMESTAMP_URL /td SHA256 `$f"
          }

          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" @arguments installer/winguard.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        # Inno Setup 6 is preinstalled on windows-latest runners.
        # Fallback if a future image drops it:
        #   winget install --id JRSoftware.InnoSetup -e -h

      - name: Also zip portable EXEs
        shell: pwsh
        run: Compress-Archive -Path publish/service/*,publish/gui/* -DestinationPath dist/WinGuard-portable-win-x64.zip

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer/Output/WinGuard-Setup-*.exe | Select-Object -First 1
          "$((Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower())  $($setup.Name)" |
            Set-Content "dist/$($setup.Name).sha256"
          "$((Get-FileHash dist/WinGuard-portable-win-x64.zip -Algorithm SHA256).Hash.ToLower())  WinGuard-portable-win-x64.zip" |
            Set-Content "dist/WinGuard-portable-win-x64.zip.sha256"

      # The tool also checks its own output against the key in the program, so a release signed
      # with a key that installed copies do not know fails here and is never published.
      - name: Sign the update manifest
        if: env.UPDATE_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          WINGUARD_UPDATE_SIGNING_KEY: ${{ secrets.WINGUARD_UPDATE_SIGNING_KEY }}
          VERSION: ${{ steps.ver.outputs.v }}
        run: |
          dotnet run --project tools/UpdateManifest -c Release -- "installer/Output/WinGuard-Setup-$env:VERSION.exe" $env:VERSION dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Warn that this release cannot be installed from the console
        if: env.UPDATE_SIGNING_ENABLED != 'true'
        shell: pwsh
        run: Write-Output '::warning::WINGUARD_UPDATE_SIGNING_KEY is not set, so no latest.json was published. Check for updates will not offer this release.'

      - name: Create GitHub Release + upload assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            installer/Output/WinGuard-Setup-*.exe
            dist/WinGuard-portable-win-x64.zip
            dist/*.sha256
            dist/latest.json
            dist/latest.json.sig

      - name: Remove the signing certificate
        if: always() && env.SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
        run: |
          if ($env:THUMBPRINT) { Remove-Item "Cert:\CurrentUser\My\$env:THUMBPRINT" -DeleteKey -ErrorAction SilentlyContinue }
